name: Feature request
description: Suggest an improvement or a new App Center app
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
  - type: textarea
    id: app
    attributes:
      label: For a new app
      description: Project page, license, official image and where it is published, whether it needs a GPU, a database, or a model server.
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'd be willing to send a pull request or test a change on my hardware
