# Gives every pull request merged into main (normally the promotion from testing) its own version: bumps gpushepherd/__init__.py, adds
# its entry to CHANGELOG.md, commits that to main as "Release X.Y.Z", tags it vX.Y.Z, publishes
# a GitHub release and pushes the image compose.standalone.yaml runs to ghcr.io (X.Y.Z and latest). Labels on the pull request pick the step: major, minor, patch (default), or
# "no release". See docs/updates.md#versions-and-releases.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write          # push the release commit and tag, create the release
  pull-requests: read      # find the pull request a commit came from
  packages: write          # push the image to ghcr.io

concurrency:
  group: release           # one at a time, in merge order
  cancel-in-progress: false

jobs:
  release:
    # the release commit itself is pushed with GITHUB_TOKEN, which never starts another run;
    # this also skips it if someone pushes one by hand
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main        # the newest main, including releases made since this push
          fetch-depth: 0
          # Pushes the release commit and tag. If main is protected by a rule that requires pull
          # requests, GITHUB_TOKEN can't push: save a token (or GitHub App token) that is allowed
          # to bypass the rule as the secret RELEASE_TOKEN. See docs/maintainer-security.md.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Find the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" > "$RUNNER_TEMP/pr.json"

      # A promotion (testing -> main, merged with a merge commit) releases the pull requests merged
      # into testing since the last release; their Changelog sections are its release notes when it
      # has none of its own. Empty for anything that isn't a merge commit.
      - name: Find the pull requests a promotion brings
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          echo '[]' > "$RUNNER_TEMP/included.json"
          git rev-parse -q --verify "$SHA^2" > /dev/null || exit 0
          for c in $(git rev-list --no-merges "$SHA^1..$SHA^2"); do
            gh api "repos/${{ github.repository }}/commits/$c/pulls"
          done | jq -s '[add // [] | .[] | select(.merged_at and .base.ref == "testing")] | unique_by(.number)' \
            > "$RUNNER_TEMP/included.json"
          jq -r '"Brings: " + (map("#\(.number)") | join(", "))' "$RUNNER_TEMP/included.json"

      - name: Bump the version and update the changelog
        id: bump
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/release.py --pr-json "$RUNNER_TEMP/pr.json" --included-json "$RUNNER_TEMP/included.json" --sha "${{ github.sha }}" \
            --subject "${SUBJECT%%$'\n'*}" --notes "$RUNNER_TEMP/notes.md" | tee -a "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        if: steps.bump.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          # someone may have merged meanwhile: put the release commit on top and try again
          for try in 1 2 3; do
            git push origin HEAD:main && break
            [ "$try" -lt 3 ] || exit 1
            git pull --rebase origin main
          done
          git tag -a "v$VERSION" -m "GPU Shepherd $VERSION"
          git push origin "v$VERSION"

      - name: Publish the GitHub release
        if: steps.bump.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "$TAG" --title "GPU Shepherd $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      # Built from the release commit checked out above, .git included, so the image records
      # which commit it is (gpushepherd/buildinfo.py). GHCR names must be lower case.
      - name: Image name
        if: steps.bump.outputs.skip == 'false'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        if: steps.bump.outputs.skip == 'false'

      - uses: docker/setup-buildx-action@v4
        if: steps.bump.outputs.skip == 'false'

      - uses: docker/login-action@v4
        if: steps.bump.outputs.skip == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the image
        if: steps.bump.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: SHEPHERD_INSTALL=image
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.bump.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.bump.outputs.version }}

      # Keep testing (where changes wait for the next release, see CONTRIBUTING.md) level with main:
      # the release commit, and any fix merged straight into main, go back into testing so the next
      # promotion starts from this release. Best effort: if testing is protected, RELEASE_TOKEN must
      # be allowed to bypass its rule too; if it fails, merge main into testing by hand.
      - name: Bring testing up to date
        continue-on-error: true
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git fetch origin testing || { echo "no testing branch"; exit 0; }
          main=$(git rev-parse HEAD)
          if git merge-base --is-ancestor FETCH_HEAD "$main"; then
            git push origin "$main:refs/heads/testing"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --quiet -B testing FETCH_HEAD
            git merge --no-edit -m "Merge main${VERSION:+ (release $VERSION)} into testing" "$main"
            git push origin testing
          fi
