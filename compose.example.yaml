# GPU Shepherd - copy to compose.yaml, adjust the paths, then:  docker compose up -d --build
# Open http://<server>:8090 and log in as "admin". The first-run password is printed in
# `docker compose logs gpu-shepherd` and saved in /opt/gpu-shepherd/INITIAL_PASSWORD.txt.
services:
  gpu-shepherd:
    build: .
    image: gpu-shepherd:local
    container_name: gpu-shepherd
    restart: unless-stopped
    # If the machine runs out of memory, the kernel stops an app before GPU Shepherd.
    oom_score_adj: -500
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    # Where Docker uses SELinux (Fedora's moby-engine, or selinux-enabled set by hand), GPU Shepherd
    # can only reach the Docker socket with SELinux labels off for it; install.sh uncomments this.
    # security_opt: [label=disable]
    ports:
      - "8090:8090"
    environment:
      SHEPHERD_DATA_DIR: /opt/gpu-shepherd
      NVIDIA_DRIVER_CAPABILITIES: utility       # lets GPU Shepherd run nvidia-smi
      # SHEPHERD_ADMIN_PASSWORD: pick-a-password # otherwise one is generated on first start
    volumes:
      # Controls Docker. This is root-equivalent: keep GPU Shepherd on a trusted network.
      - /var/run/docker.sock:/var/run/docker.sock
      # The data folder MUST be mounted at the same path inside and outside: GPU Shepherd hands
      # paths inside it to Docker for the containers it creates (same rule as Dockge's stacks dir).
      - /opt/gpu-shepherd:/opt/gpu-shepherd
      # Disks under /mnt (where Settings > Storage mounts new drives and moves folders to), at the
      # same path, so GPU Shepherd can count and clean up moved folders. rslave: a drive mounted
      # there later shows up without restarting GPU Shepherd.
      - /mnt:/mnt:rslave
      # Optional: folders whose model files you want to pick from in the UI - also same path.
      # - /srv/models:/srv/models:ro
    # On a machine with AMD GPUs only (no NVIDIA), delete this deploy: section; install.sh does.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]   # only used to read GPU stats; no GPU memory is taken
