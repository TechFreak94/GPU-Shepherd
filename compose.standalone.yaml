# GPU Shepherd without cloning the repository: runs the published image, nothing to build.
# Needs Docker with the Compose plugin, the NVIDIA driver and the NVIDIA Container Toolkit.
#
#   sudo docker login ghcr.io   # while the image is private: your GitHub user and a token with read:packages
#   mkdir gpu-shepherd && cd gpu-shepherd
#   save this file there as compose.yaml
#   sudo docker compose up -d
#   sudo docker compose logs gpu-shepherd | grep "First start"   # the generated admin password
#
# Open http://<server>:8090 and log in as "admin" (the password is also saved in
# INITIAL_PASSWORD.txt in the data folder). On the first start it sets up the Starter preset (an
# LLM server, ComfyUI and Open WebUI; nothing starts until you press Start) and downloads its
# models (about 15 GB) in the background. Addresses and logins: PRESET_NOTES.txt in the data folder.
#
# To change any of this, put it in a .env file next to this one instead of editing it, for example:
#
#   SHEPHERD_DATA_DIR=/srv/gpu-shepherd
#   SHEPHERD_MODELS_DIR=/srv/models   # default: a models folder inside the data folder
#   SHEPHERD_PORT=8091
#   SHEPHERD_PRESET=none              # start empty instead of with the Starter preset
#   SHEPHERD_DOWNLOAD_MODELS=0        # create the preset, but don't download its models
#   SHEPHERD_VERSION=0.13.4           # a release to stay on; "latest" (the default) follows releases
#
# The preset and its downloads only happen on the very first start, into an empty data folder.
#
# Update:   sudo docker compose pull && sudo docker compose up -d
# Go back:  set SHEPHERD_VERSION to the release you had, then  sudo docker compose up -d
# Your instances keep running while GPU Shepherd restarts. The dashboard's Update button and the
# daily update check need a clone with install.sh / update.sh; this way you update with the above.
services:
  gpu-shepherd:
    image: ghcr.io/techfreak94/gpu-shepherd:${SHEPHERD_VERSION:-latest}
    container_name: gpu-shepherd
    restart: unless-stopped
    # If the machine runs out of memory, the kernel stops an app before GPU Shepherd.
    oom_score_adj: -500
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    # Where Docker uses SELinux (Fedora's moby-engine, or selinux-enabled set by hand), GPU Shepherd
    # can only reach the Docker socket with SELinux labels off for it: uncomment this.
    # security_opt: [label=disable]
    ports:
      - "${SHEPHERD_PORT:-8090}:8090"
    environment:
      SHEPHERD_DATA_DIR: ${SHEPHERD_DATA_DIR:-/opt/gpu-shepherd}
      SHEPHERD_MODELS_DIR: ${SHEPHERD_MODELS_DIR:-${SHEPHERD_DATA_DIR:-/opt/gpu-shepherd}/models}
      SHEPHERD_PRESET: ${SHEPHERD_PRESET:-starter}
      SHEPHERD_DOWNLOAD_MODELS: ${SHEPHERD_DOWNLOAD_MODELS:-1}
      NVIDIA_DRIVER_CAPABILITIES: utility       # lets GPU Shepherd run nvidia-smi
      # SHEPHERD_ADMIN_PASSWORD: pick-a-password # otherwise one is generated on first start
    volumes:
      # Controls Docker. This is root-equivalent: keep GPU Shepherd on a trusted network.
      - /var/run/docker.sock:/var/run/docker.sock
      # The data folder MUST be mounted at the same path inside and outside: GPU Shepherd hands
      # paths inside it to Docker for the containers it creates (same rule as Dockge's stacks dir).
      - ${SHEPHERD_DATA_DIR:-/opt/gpu-shepherd}:${SHEPHERD_DATA_DIR:-/opt/gpu-shepherd}
      # The models folder, also at the same path; downloads go here.
      - ${SHEPHERD_MODELS_DIR:-${SHEPHERD_DATA_DIR:-/opt/gpu-shepherd}/models}:${SHEPHERD_MODELS_DIR:-${SHEPHERD_DATA_DIR:-/opt/gpu-shepherd}/models}
      # Optional: more folders whose model files you want to pick from in the UI - same path too.
      # - /srv/more-models:/srv/more-models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]   # only used to read GPU stats; no GPU memory is taken
