# ComfyUI for images and video. Always GPU 0, highest priority: when it starts, the LLM server
# moves to GPU 1; when it stops, the LLM gets both GPUs back.
# Image: https://github.com/YanWenKun/ComfyUI-Docker (CUDA 13, needs NVIDIA driver 580 or newer).
# Checkpoints, LoRAs, VAEs... go in the models folder's comfyui/ subfolder.
id: comfyui
name: ComfyUI
description: Image and video generation
kind: container
image: yanwk/comfyui-boot:cu130-slim-v2
env:
  CLI_ARGS: ""
ports:
  - {host: 8188, container: 8188}
volumes:
  - {host: /srv/models/comfyui, container: /root/ComfyUI/models}
  - {host: /opt/gpu-shepherd/appdata/comfyui/custom_nodes, container: /root/ComfyUI/custom_nodes}
  - {host: /opt/gpu-shepherd/appdata/comfyui/input, container: /root/ComfyUI/input}
  - {host: /opt/gpu-shepherd/appdata/comfyui/output, container: /root/ComfyUI/output}
  - {host: /opt/gpu-shepherd/appdata/comfyui/user, container: /root/ComfyUI/user}
  - {host: /opt/gpu-shepherd/appdata/comfyui/cache, container: /root/.cache}
gpu: {mode: fixed, gpus: [0], priority: 80}
autostart: true
