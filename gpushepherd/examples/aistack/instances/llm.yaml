# llama-swap: one OpenAI-compatible endpoint, loads the model a client asks for.
# Elastic: uses every free GPU, shrinks to one when ComfyUI needs GPU 0.
id: llm
name: LLM server
description: llama-swap with Qwen3.6 35B-A3B and Muse Glimmer
kind: llama-swap
image: ghcr.io/mostlygeek/llama-swap:cuda
ports:
  - {host: 8080, container: 8080}
volumes:
  - {host: /home/you/aistack/models, container: /models, read_only: true}
gpu: {mode: elastic, min_gpus: 1, max_gpus: 0, priority: 50}
autostart: true
open_path: /ui
