# Open WebUI: chat with the models (and with Hermes through its API).
id: webui
name: Chat UI
description: Open WebUI for the models and Hermes
kind: container
image: ghcr.io/open-webui/open-webui:main
ports:
  - {host: 3000, container: 8080}
env:
  OPENAI_API_BASE_URLS: http://llm:8080/v1;http://hermes:8642/v1
  OPENAI_API_KEYS: REPLACE_WITH_LLM_API_KEY;change-me-hermes-api-key
  ENABLE_OLLAMA_API: "false"
volumes:
  - {host: /home/you/aistack/data/open-webui, container: /app/backend/data}
autostart: false
