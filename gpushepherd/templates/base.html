<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false,"historyCacheSize":0}'>
<title>{% block title %}GPU Shepherd{% endblock %}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css?v={{ version }}">
<script src="/static/htmx.min.js?v={{ version }}" defer></script>
<script src="/static/app.js?v={{ version }}" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="/">GPU Shepherd</a>
    {% if demo %}<span class="tag warn">demo mode - nothing real is started</span>{% endif %}
    {% if user %}
    <nav>
      <a href="/">Dashboard</a>
      <a href="/instances/new">Add instance</a>
      <a href="/settings">Settings</a>
      <button class="link" hx-post="/logout">Log out</button>
    </nav>
    {% endif %}
  </div>
</header>
<main class="wrap">
  {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
<div id="toasts" aria-live="polite"></div>
</body>
</html>
