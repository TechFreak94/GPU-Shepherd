<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false,"historyCacheSize":0}'>
<title>{% block title %}GPU Shepherd{% endblock %}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
<script src="/static/htmx.min.js?v={{ asset_version }}" defer></script>
<script src="/static/app.js?v={{ asset_version }}" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="/">GPU Shepherd</a>
    {% if user %}<button class="link version" hx-get="/ui/update" hx-target="#modal-body" title="Version, check for updates, what's new">v{{ version }}</button>{% endif %}
    {% if demo %}<span class="tag warn">demo mode - nothing real is started</span>{% endif %}
    {% if user %}
    <nav>
      {% set here = request.url.path %}
      <a href="/"{% if here == "/" %} aria-current="page"{% endif %}>Dashboard</a>
      <a href="/apps"{% if here.startswith("/apps") or here.startswith("/instances/new") %} aria-current="page"{% endif %}>App Store</a>
      <a href="/settings"{% if here == "/settings" %} aria-current="page"{% endif %}>Settings</a>
      <button class="link" hx-post="/logout" title="Log out of GPU Shepherd">Log out</button>
    </nav>
    {% endif %}
  </div>
</header>
<main class="wrap">
  {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
<div id="toasts" aria-live="polite"></div>
</body>
</html>
