{# Automatic vs manual install of one App Center app; `manual` says which page this is #}
<nav class="modes" aria-label="How to install {{ app_t.title }}">
  <a class="mode" href="/apps/{{ app_t.key }}"{% if not manual %} aria-current="page"{% endif %}>
    <strong>Automatic setup <span class="tag accent">recommended</span></strong>
    <span>A few questions; GPU Shepherd picks free ports, folders and connections.</span></a>
  <a class="mode" href="/apps/{{ app_t.key }}?mode=manual"{% if manual %} aria-current="page"{% endif %}>
    <strong>Manual configuration <span class="tag">advanced</span></strong>
    <span>Every field by hand: image, ports, folders, environment, GPU policy.</span></a>
</nav>
