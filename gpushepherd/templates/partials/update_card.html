{# Settings > Updates, refreshed in place. u = updates.UpdateStatus #}
{% include "partials/update_status.html" %}
{% if u.dashboard_updates %}
<div class="actions">
  <button hx-post="/ui/update/check" hx-swap="none" {% if u.busy %}disabled{% endif %}>Check now</button>
  <button hx-get="/ui/update/log" hx-target="#modal-body">Last update log</button>
  {% if u.available or u.rebuild_needed %}<button class="primary" hx-get="/ui/update?confirm=1" hx-target="#modal-body" {% if u.busy %}disabled{% endif %}>Update…</button>{% endif %}
</div>
{% endif %}
