[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-shepherd"
dynamic = ["version"]       # from gpushepherd/__init__.py, which the release workflow bumps
description = "A web dashboard that runs your self-hosted AI containers and shares the GPUs between them automatically."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "docker>=7.0",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gpu-shepherd = "gpushepherd.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "gpushepherd.__version__"}

[tool.setuptools.packages.find]
include = ["gpushepherd*"]

[tool.setuptools.package-data]
gpushepherd = ["templates/*.html", "templates/partials/*.html", "static/*", "presets/*.md", "presets/*.sh", "presets/*/*.yaml", "presets/*/*.txt", "presets/*/*.md", "presets/*/*/*.yaml", "presets/*/appdata/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
