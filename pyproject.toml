[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-shepherd"
dynamic = ["version"]       # from gpushepherd/__init__.py, which the release workflow bumps
description = "A web dashboard that runs your self-hosted AI containers and shares the GPUs between them automatically."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "docker>=7.0",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "pypdf[crypto]>=4.0",   # crypto: many shop PDFs are AES-encrypted with an empty password
    "pypdfium2>=4.20",      # PDFium: text pypdf misses, and pages drawn for OCR
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gpu-shepherd = "gpushepherd.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "gpushepherd.__version__"}

[tool.setuptools.packages.find]
include = ["gpushepherd*"]

[tool.setuptools.package-data]
gpushepherd = ["templates/*.html", "templates/partials/*.html", "static/*", "presets/*.md", "presets/*.sh", "presets/*/*.yaml", "presets/*/*.txt", "presets/*/*.md", "presets/*/*/*.yaml", "presets/*/appdata/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# mistakes, not style: unused and undefined names, broken syntax and comparisons
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "E731"]       # a few short statements on one line, and small lambdas, are fine here
